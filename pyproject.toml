[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-id-library"
version = "0.1.0"
description = "Typed 16-character public ID encoder/decoder for SQL integer keys"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "XCTX"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

[tool.setuptools]
py-modules = ["sql_id_library"]
